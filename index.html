<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="טוי והפרח — משחק אינטראקטיבי ללימוד Flexbox.">
    <title>טוי והפרח | משחק Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#game-main">דלגו למשחק</a>

    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="#game-main" aria-label="טוי והפרח — חזרה למשחק">
                <span class="brand-photo" aria-hidden="true">
                    <img src="assets/Toy.JPG" alt="">
                </span>
                <span class="brand-copy">
                    <span class="brand-title">טוי והפרח</span>
                    <span class="brand-subtitle">משחק Flexbox</span>
                </span>
            </a>
        </header>

        <main id="game-main">
            <section class="intro-card" aria-labelledby="game-title">
                <div class="intro-copy">
                    <p class="eyebrow">המסע של טוי</p>
                    <h1 id="game-title">עזרו לטוי להגיע לפרחים</h1>
                    <p>בחרו את ערכי ה־Flexbox שימקמו את טוי בדיוק על היעדים.</p>
                </div>
                <div class="level-counter" aria-live="polite">
                    <span>שלב</span>
                    <span id="current-level-number" class="level-number">1</span>
                    <span>מתוך <span id="total-levels" class="text-emphasis">10</span></span>
                </div>
            </section>

            <div class="game-workspace">
                <section class="control-panel" aria-labelledby="level-title">
                    <div class="level-heading">
                        <span id="level-badge" class="level-badge">שלב 1</span>
                        <h2 id="level-title">אל הפרח הראשון</h2>
                    </div>

                    <p id="level-instruction" class="level-instruction"></p>
                    <p id="level-learning" class="learning-note"></p>

                    <form id="flex-form" novalidate>
                        <div class="code-block" aria-label="הגדרות Flexbox">
                            <div class="code-line code-line-fixed">
                                <code>display: flex;</code>
                                <span>קבוע</span>
                            </div>
                            <div id="property-controls"></div>
                        </div>

                        <div class="action-buttons">
                            <button class="button button-primary" id="check-button" type="submit">בדיקת פתרון</button>
                            <button class="button button-secondary" id="reset-button" type="button">איפוס</button>
                        </div>
                    </form>
                </section>

                <section class="board-card" aria-labelledby="board-title">
                    <div class="board-heading">
                        <div>
                            <p class="eyebrow">לוח המשחק</p>
                            <h2 id="board-title">שביל הפרחים</h2>
                        </div>
                    </div>

                    <div class="board-viewport" tabindex="0" aria-label="לוח משחק קבוע. במסך צר ניתן לגלול לצדדים.">
                        <div id="game-board" class="game-board">
                            <div id="target-layer" class="piece-layer target-layer" aria-hidden="true"></div>
                            <div id="player-layer" class="piece-layer player-layer"></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
